<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Dialog Modal Example</title>
    </head>
    <body>

        <dialog open>
            <h2>Notification</h2>
            <p>This is a simple message using only the native HTML
                &lt;dialog&gt; element with the 'open' attribute. No CSS or
                JavaScript is used.</p>

            <form method="dialog">
                <button type="submit">Dismiss</button>
            </form>
        </dialog>

    </body>
</html>
