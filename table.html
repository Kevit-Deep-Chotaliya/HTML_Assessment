<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Marks Table</title>
        <style>
            .container {
                display: flex;
                text-align: center;
                justify-content: center;
                align-items: center;
            }
        </style>
    </head>

                        <th>Roll No.</th>

                    </tr>
                </thead>

                <tbody>

                    </tr>
                    <tr>
                         <td>Shyam</td>
                        <td>2</td>
                        <td>75</td>
                        <td>66</td>
                        <td>98</td>

                    </tr>
                    <tr>
                         <td>Vanraj</td>
                        <td>3</td>

                    </tr>
                      <tr>
                         <td>Kevin</td>

                      <tr>

                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
